# Run Mira on the host's network, on Linux, so that the discovery
# messages Jellyfin apps broadcast on the local network reach it:
#   docker compose -f compose.yaml -f compose.host.yaml up -d
# PostgreSQL keeps its own network, published on the host's loopback only,
# where Mira reaches it. Mira listens on the host's port 8096 for
# HTTP and 7359 for discovery.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  mira:
    network_mode: host
    ports: !reset []
    environment:
      MIRA_DATABASE_URL: postgresql://mira:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/mira
